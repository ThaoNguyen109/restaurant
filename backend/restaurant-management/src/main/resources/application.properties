spring.application.name=restaurant-management

spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh

spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=restaurant-management-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
jwt.expiration=3600000