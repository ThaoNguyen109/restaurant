spring.application.name=restaurant-management

spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh

spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=restaurant-management-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
jwt.expiration=3600000

# File Upload Configuration
file.upload-dir=uploads/menu-items
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =======================================================
# Mail Configuration (Gmail SMTP)
# =======================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000